name: nightly-sentinel
on:
  schedule:
    - cron: '30 2 * * *'   # 03:30/04:30 Zagreb — end-of-day all-systems check
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Send the alarm email even when all green (test)'
        default: '0'
      alert_to:
        description: 'Override recipients (comma-separated) — for tests'
        default: ''
jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run all-systems check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_TO: ${{ github.event.inputs.alert_to || 'juginovic.alen@gmail.com,laura.rodman@medx.hr' }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email || '0' }}
        run: python3 .github/scripts/sentinel.py
