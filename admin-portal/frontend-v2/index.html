<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med&X Admin</title>
<meta name="description" content="Med&X admin portal — Today, projects, inbox, people, money, calendar, event day.">
<meta name="theme-color" content="#201b16">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med&X Admin">
<!-- fonts: exactly the artboards' Google Fonts request (the admin server CSP allows fonts.googleapis/gstatic) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<!-- runtime config — the deploy stamps config.staging.js / config.production.js into this block (scripts/apply-config.js) -->
<script>/* MEDX_CONFIG:start */window.MEDX_CONFIG={apiBase:'',memberBase:'/__member',memberPortalUrl:'http://localhost:8890',env:'staging'};/* MEDX_CONFIG:end */</script>
</head>
<body data-layout="portal">
<div id="app">
  <header id="chrome"></header>
  <main id="view" aria-live="polite"></main>
</div>
<div id="chrome-overlays"></div>
<noscript>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;background:#f6f2ea;color:#201b16;font-family:Inter,sans-serif">
    <div><div style="font-family:Fraunces,serif;font-style:italic;font-size:30px">The admin portal needs JavaScript.</div><p style="font-size:14px;color:#6d6459;margin-top:12px">Enable it in your browser settings, then reload this page.</p></div>
  </div>
</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
