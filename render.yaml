services:
  - type: web
    name: medx-user-portal
    runtime: node
    rootDir: user-portal/backend
    # stamp-sw.sh cache-busts the service worker CACHE_NAME with the deploy's git
    # SHA. It self-locates the repo root (../../scripts) and never fails the build.
    buildCommand: npm install && bash ../../scripts/stamp-sw.sh
    startCommand: node server.js
    # Render probes this on every deploy — a new instance only takes traffic once
    # /health returns 200, so a boot that crashes rolls back to the old instance
    # instead of taking the portal down (pairs with the boot-smoke CI net).
    healthCheckPath: /health
    # Deploy when EITHER the backend or the served frontend changes. Without this,
    # a frontend-only commit (e.g. index.html) is skipped because rootDir is the backend.
    buildFilter:
      paths:
        - user-portal/**
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Email — set Resend API key in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Med&X <noreply@medx.hr>"
      # Push Notifications (VAPID)
      - key: VAPID_PUBLIC_KEY
        value: BLaqYNwn9YVPEbvY7qzvR-WtP8NPPe7dG4V9XDmFd0A4k4WdbSbnrBEuO_uo69T-lt2a9NxJ1_5a0jvC4TJZGIU
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:accelerator@medx.hr"
      # Stripe — set actual values in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # FIRA fiscal invoicing (optional)
      - key: FIRA_API_KEY
        sync: false
      - key: FIRA_API_URL
        value: https://app.fira.finance
      # Bank transfer details — set REAL values in the Render dashboard.
      # MEDX_IBAN must be the real account; if unset or left as a placeholder the portal
      # hides bank-transfer instructions rather than show a fake IBAN. (MEDX_VAT_ID is
      # reserved for future invoice use — nothing reads it yet.)
      - key: MEDX_IBAN
        sync: false
      - key: MEDX_BANK_NAME
        value: "Zagrebačka banka d.d."
      - key: MEDX_SWIFT
        value: ZABAHR2X
      - key: MEDX_COMPANY_NAME
        value: "Med&X"
      - key: MEDX_VAT_ID
        sync: false
      # Turso cloud database (persistent SQLite)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Google Wallet event tickets. Issuer id + approved event-ticket class id are NOT secrets
      # (safe to commit); the service-account JSON is a secret → set it in the Render dashboard.
      # Until GOOGLE_WALLET_SA_KEY is set, wallet endpoints return {configured:false} and nothing
      # breaks. Both portals need these (user builds passes; admin provisions classes + revokes).
      - key: GOOGLE_WALLET_ISSUER_ID
        value: "3388000000023175280"
      - key: GOOGLE_WALLET_EVENT_CLASS_ID
        value: "3388000000023175280.3388000000023175280.plexus_week_2026"
      - key: GOOGLE_WALLET_SA_KEY
        sync: false
    plan: free

  - type: web
    name: medx-admin-portal
    runtime: node
    rootDir: admin-portal/backend
    # stamp-sw.sh cache-busts the service worker CACHE_NAME with the deploy's git
    # SHA. It self-locates the repo root (../../scripts) and never fails the build.
    buildCommand: npm install && bash ../../scripts/stamp-sw.sh
    startCommand: node server.js
    # Render probes this on every deploy — a new instance only takes traffic once
    # /health returns 200, so a boot that crashes rolls back to the old instance.
    healthCheckPath: /health
    # Deploy on any admin-portal change (backend OR the served frontend/index.html).
    buildFilter:
      paths:
        - admin-portal/**
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Email — set Resend API key in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Med&X <noreply@medx.hr>"
      # Amadeus Self-Service (LIVE speaker flight-offer search) — owner action:
      # create a free app at developers.amadeus.com and set both keys in the
      # Render dashboard. Until set, the admin portal shows a clean key-gate and
      # keeps the deep-links + manual fare table working (never a fake offer).
      # Set AMADEUS_ENV=production once the Amadeus app is promoted.
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      - key: AMADEUS_ENV
        value: test
      # Turso cloud database (persistent SQLite)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Google Wallet event tickets. Issuer id + approved event-ticket class id are NOT secrets
      # (safe to commit); the service-account JSON is a secret → set it in the Render dashboard.
      # Until GOOGLE_WALLET_SA_KEY is set, wallet endpoints return {configured:false} and nothing
      # breaks. Both portals need these (user builds passes; admin provisions classes + revokes).
      - key: GOOGLE_WALLET_ISSUER_ID
        value: "3388000000023175280"
      - key: GOOGLE_WALLET_EVENT_CLASS_ID
        value: "3388000000023175280.3388000000023175280.plexus_week_2026"
      - key: GOOGLE_WALLET_SA_KEY
        sync: false
    plan: free

  - type: web
    name: medx-gateway
    runtime: node
    rootDir: landing
    buildCommand: echo "No build needed"
    startCommand: node serve.js
    envVars:
      - key: PORT
        value: 3005
    plan: free
