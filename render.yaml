services:
  - type: web
    name: medx-user-portal
    runtime: node
    rootDir: user-portal/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Email — set Resend API key in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Med&X <noreply@medx.hr>"
      # Push Notifications (VAPID)
      - key: VAPID_PUBLIC_KEY
        value: BLaqYNwn9YVPEbvY7qzvR-WtP8NPPe7dG4V9XDmFd0A4k4WdbSbnrBEuO_uo69T-lt2a9NxJ1_5a0jvC4TJZGIU
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:accelerator@medx.hr"
      # Stripe — set actual values in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # FIRA fiscal invoicing (optional)
      - key: FIRA_API_KEY
        sync: false
      - key: FIRA_API_URL
        value: https://app.fira.finance
      # Bank transfer details — set REAL values in the Render dashboard.
      # MEDX_IBAN/MEDX_VAT_ID must be the real account/VAT id; if unset or left as a
      # placeholder the portal hides bank-transfer instructions rather than show a fake IBAN.
      - key: MEDX_IBAN
        sync: false
      - key: MEDX_BANK_NAME
        value: "Zagrebačka banka d.d."
      - key: MEDX_SWIFT
        value: ZABAHR2X
      - key: MEDX_COMPANY_NAME
        value: "Med&X"
      - key: MEDX_VAT_ID
        sync: false
      # Turso cloud database (persistent SQLite)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    plan: free

  - type: web
    name: medx-admin-portal
    runtime: node
    rootDir: admin-portal/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Email — set Resend API key in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Med&X <noreply@medx.hr>"
      # Turso cloud database (persistent SQLite)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    plan: free

  - type: web
    name: medx-gateway
    runtime: node
    rootDir: landing
    buildCommand: echo "No build needed"
    startCommand: node serve.js
    envVars:
      - key: PORT
        value: 3005
    plan: free
